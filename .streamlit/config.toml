[theme]
base = "light"
primaryColor = "#1F4B7A"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#EEECE5"
textColor = "#1B2430"
linkColor = "#1F4B7A"
borderColor = "#E0DCD1"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#EEECE5"
chartCategoricalColors = ["#1F4B7A", "#E0A526", "#6C9BC4", "#9A7B4F", "#3F7F6B", "#B5523B"]

[theme.sidebar]
backgroundColor = "#13243A"
secondaryBackgroundColor = "#1D3350"
textColor = "#E6EBF2"
primaryColor = "#E0A526"
borderColor = "#2A4466"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
